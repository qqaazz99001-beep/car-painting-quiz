    </div>

    <!-- 年度切換與模式選擇列 -->
    <div class="max-w-4xl mx-auto px-4 pb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <!-- 年度頁籤 -->
      <div class="flex bg-slate-100 p-1 rounded-xl text-sm font-bold">
        <button onclick="switchYear('104')" id="tab-104" class="px-4 py-1.5 rounded-lg transition text-slate-600">104 年度</button>
        <button onclick="switchYear('105')" id="tab-105" class="px-4 py-1.5 rounded-lg transition text-slate-600">105 年度</button>
        <button onclick="switchYear('106')" id="tab-106" class="px-4 py-1.5 rounded-lg transition text-slate-600">106 年度</button>
      </div>

      <!-- 模式切換 -->

        <button onclick="setMode('study')" id="mode-study" class="px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <span>📖</span> 讀書背題
        </button>
        <button onclick="setMode('instant')" id="mode-instant" class="px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <span>⚡</span> 即時練習
        </button>
        <button onclick="setMode('exam')" id="mode-exam" class="px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <span>📝</span> 模擬測驗
        </button>
      </div>
    </div>

    <div id="statusBar" class="bg-slate-800 text-white text-xs px-4 py-2 border-t border-slate-700">
      <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">

  </header>

    <div class="mb-5 flex flex-col sm:flex-row gap-3">

      </div>
      <div class="flex items-center gap-2 text-xs text-slate-500 font-medium">
        <span>快速跳題：</span>

          <!-- 動態生成 1~80 題 -->

      </div>
    </div>

    <!-- 題目列表容器 -->
    <div id="questionList" class="space-y-4"></div>

        [76,"處理化學物後須徹底洗手是工作時個人應有的",["潔癖","安全衛生","避免被責備","形式化習慣"],2],
        [77,"一般可燃性固體如木材、紙張、紡織品、橡膠等所引起之火災，稱為",["丁類","甲類","丙類","乙類 火災"],2],
        [78,"氧化鐵與氧化鈦顏料屬於",["有機顏料","含鉛顏料","無機顏料","含汞顏料"],3],
        [79,"聚胺酯塗料如果加入硝化纖維素塗料溶劑會發生",["橘子皮","高光澤","白化","小氣泡與針孔"],4],
        [80,"室內空氣品質的好壞，一般是以空氣中的何者作為指標",["一氧化碳","二氧化碳","氦氣","氧氣"],2]
      ]
    };

    // 系統狀態
    let currentYear = '104';
    let currentMode = 'study'; // 'study' | 'instant' | 'exam'
    let userAnswers = { '104': {}, '105': {}, '106': {} };
    let isSubmitted = { '104': false, '105': false, '106': false };
    let showWrongOnly = false;
    let searchQuery = '';

    // 初始化跳題選單
    function initJumpSelect() {
      const select = document.getElementById('jumpSelect');
      select.innerHTML = '<option value="">選擇題號...</option>';
      for (let i = 1; i <= 80; i++) {
        select.innerHTML += `<option value="q-${i}">第 ${i} 題</option>`;
      }
    }

    function jumpToQuestion(id) {
      if (!id) return;
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // 切換模式
    function setMode(mode) {
      currentMode = mode;
      
      // 更新按鈕外觀
      ['study', 'instant', 'exam'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.className = 'px-3 py-1.5 rounded-lg transition flex items-center gap-1 bg-white text-blue-700 shadow-sm font-bold';
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg transition flex items-center gap-1 text-slate-600 hover:text-slate-800';
        }
      });

      const submitBtn = document.getElementById('submitBtn');
      const filterControl = document.getElementById('filterControl');

      if (mode === 'study') {
        submitBtn.classList.add('hidden');
        filterControl.classList.add('hidden');
        showWrongOnly = false;
        updateStatusBar('📖 讀書背題模式：每題皆直接標示標準答案，專注理解與記憶');
      } else if (mode === 'instant') {
        submitBtn.classList.add('hidden');
        filterControl.classList.add('hidden');
        showWrongOnly = false;
        updateStatusBar('⚡ 即時練習模式：點選選項立刻得知對錯與答案');
      } else if (mode === 'exam') {
        submitBtn.classList.remove('hidden');
        filterControl.classList.remove('hidden');
        updateStatusBar(isSubmitted[currentYear] ? getExamResultText() : '📝 模擬測驗模式：作答完畢請點擊右上角「交卷對答案」');
      }

      renderQuestions();
    }

    // 切換年度
    function switchYear(year) {
      currentYear = year;
      ['104', '105', '106'].forEach(y => {
        const tab = document.getElementById(`tab-${y}`);
        if (y === year) {
          tab.className = 'px-4 py-1.5 rounded-lg transition bg-white text-blue-700 shadow-sm font-black';
        } else {
          tab.className = 'px-4 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-800';
        }
      });

      if (currentMode === 'exam') {
        updateStatusBar(isSubmitted[currentYear] ? getExamResultText() : '📝 模擬測驗模式：作答完畢請點擊右上角「交卷對答案」');
      }
      renderQuestions();
    }

    function updateStatusBar(text) {
      document.getElementById('statusText').innerHTML = `<span>${text}</span>`;
    }

    function getExamResultText() {
      const qList = RAW_QUESTIONS[currentYear];
      const ansMap = userAnswers[currentYear];
      let correctCount = 0;
      qList.forEach(q => {
        if (ansMap[q[0]] === q[3]) correctCount++;
      });
      const score = (correctCount * 1.25).toFixed(1);
      const pass = score >= 60;
      return `測驗結果：答對 ${correctCount}/80 題 · 得分 <strong class="text-base ${pass ? 'text-emerald-400' : 'text-rose-400'}">${score} 分</strong> (${pass ? '合格 🎉' : '未達60分及格'})`;
    }

    // 選取選項
    function selectOption(qNum, optIdx) {
      if (currentMode === 'study') return; // 背題模式不可點選
      if (currentMode === 'exam' && isSubmitted[currentYear]) return; // 已交卷鎖定

      userAnswers[currentYear][qNum] = optIdx;
      renderQuestions();
    }

    // 交卷
    function submitExam() {
      const qList = RAW_QUESTIONS[currentYear];
      const ansMap = userAnswers[currentYear];
      const answeredCount = Object.keys(ansMap).length;

      if (answeredCount < 80) {
        if (!confirm(`您還有 ${80 - answeredCount} 題尚未作答，確定要現在交卷計算成績嗎？`)) {
          return;
        }
      }
      isSubmitted[currentYear] = true;
      setMode('exam');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 重置
    function resetCurrentYear() {
      if (confirm(`確定要重置 ${currentYear} 年度的作答紀錄嗎？`)) {
        userAnswers[currentYear] = {};
        isSubmitted[currentYear] = false;
        showWrongOnly = false;
        renderQuestions();
        if (currentMode === 'exam') {
          updateStatusBar('📝 模擬測驗模式：作答完畢請點擊右上角「交卷對答案」');
        }
      }
    }

    // 切換只看錯題
    function toggleWrongOnly() {
      showWrongOnly = !showWrongOnly;
      const btn = document.getElementById('wrongOnlyBtn');
      btn.className = showWrongOnly 
        ? 'px-2 py-0.5 rounded bg-amber-400 text-slate-900 font-bold text-xs' 
        : 'px-2 py-0.5 rounded bg-slate-700 hover:bg-slate-600 border border-slate-600 text-xs text-amber-300';
      renderQuestions();
    }

    // 搜尋過濾
    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      renderQuestions();
    }

    // 渲染題目
    function renderQuestions() {
      const container = document.getElementById('questionList');
      const qList = RAW_QUESTIONS[currentYear];
      const ansMap = userAnswers[currentYear];
      const submitted = isSubmitted[currentYear];

      let html = '';
      let visibleCount = 0;

      qList.forEach(item => {
        const [qNum, qText, options, correctAns] = item;
        const userChoice = ansMap[qNum];
        const isAnswered = userChoice !== undefined;
        const isCorrect = userChoice === correctAns;

        // 搜尋過濾
        if (searchQuery) {
          const matchQ = qText.toLowerCase().includes(searchQuery);
          const matchOpt = options.some(o => o.toLowerCase().includes(searchQuery));
          if (!matchQ && !matchOpt) return;
        }

        // 錯題過濾 (模擬測驗交卷後)
        if (showWrongOnly && isCorrect) return;

        visibleCount++;

        html += `
          <div id="q-${qNum}" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 transition">
            <!-- 題幹 -->
            <div class="flex items-start justify-between gap-3 mb-4">
              <div class="flex items-start gap-2">
                <span class="inline-flex items-center justify-center bg-slate-100 text-slate-700 text-xs font-black px-2.5 py-1 rounded-lg">
                  第 ${qNum} 題
                </span>
                <h2 class="text-base font-bold text-slate-800 leading-snug pt-0.5">
                  ${qText}
                </h2>
              </div>
              ${currentMode === 'study' ? `
                <span class="shrink-0 bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-1 rounded-md">
                  答案：選項 (${correctAns})
                </span>
              ` : ''}
            </div>

            <!-- 選項 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        `;

        options.forEach((optText, idx) => {
          const optNum = idx + 1;
          let optStyle = "border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100";
          let badge = `<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-slate-200 text-slate-600 mr-2.5 shrink-0">${optNum}</span>`;

          if (currentMode === 'study') {
            // 📖 背題模式：直接將正確答案高亮成綠色
            if (optNum === correctAns) {
              optStyle = "border-emerald-500 bg-emerald-50/80 text-emerald-900 font-bold shadow-sm";
              badge = `<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-emerald-600 text-white mr-2.5 shrink-0">✓</span>`;
            } else {
              optStyle = "border-slate-200 bg-white text-slate-500 opacity-80";
            }
          } else if (currentMode === 'instant') {
            // ⚡ 即時練習模式：點了立刻反饋
            if (isAnswered) {
              if (optNum === correctAns) {
                optStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-2 ring-emerald-400";
                badge = `<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-emerald-600 text-white mr-2.5 shrink-0">✓</span>`;
              } else if (optNum === userChoice) {
                optStyle = "border-rose-400 bg-rose-50 text-rose-900 ring-2 ring-rose-400";
                badge = `<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-rose-500 text-white mr-2.5 shrink-0">✕</span>`;
              } else {
                optStyle = "border-slate-200 bg-white text-slate-400";
              }
            } else {
              optStyle = "border-slate-200 bg-white text-slate-700 hover:border-blue-400 hover:bg-blue-50/30 cursor-pointer";
            }
          } else if (currentMode === 'exam') {
            // 📝 模擬測驗模式
            if (!submitted) {
              if (optNum === userChoice) {
                optStyle = "border-blue-600 bg-blue-50 text-blue-900 font-bold ring-2 ring-blue-500 cursor-pointer";
                badge = `<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-blue-600 text-white mr-2.5 shrink-0">${optNum}</span>`;
              } else {
                optStyle = "border-slate-200 bg-white text-slate-700 hover:border-slate-300 hover:bg-slate-50 cursor-pointer";
              }
            } else {
              // 交卷後對答案
              if (optNum === correctAns) {
                optStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-2 ring-emerald-500";
                badge = `<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-emerald-600 text-white mr-2.5 shrink-0">✓</span>`;
              } else if (optNum === userChoice) {
                optStyle = "border-rose-400 bg-rose-50 text-rose-900 ring-2 ring-rose-400";
                badge = `<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-rose-500 text-white mr-2.5 shrink-0">✕</span>`;
              } else {
                optStyle = "border-slate-200 bg-white text-slate-400";
              }
            }
          }

          html += `
            <div onclick="selectOption(${qNum}, ${optNum})" class="flex items-center px-3.5 py-2.5 rounded-xl border text-sm transition ${optStyle}">
              ${badge}
              <span class="leading-snug">${optText}</span>
            </div>
          `;
        });

        html += `
            </div>
          </div>
        `;
      });

      if (visibleCount === 0) {
        html = `
          <div class="bg-white rounded-2xl p-10 text-center border border-slate-200 text-slate-500">
            <p class="text-base font-bold">沒有符合條件的題目</p>
            <p class="text-xs mt-1">請嘗試清除搜尋關鍵字或關閉錯題篩選</p>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // 啟動初始化
    initJumpSelect();
    switchYear('104');
    setMode('study');
  </script>
