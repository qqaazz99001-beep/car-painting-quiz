                { id: 78, ans: 3, q: "氧化鐵與氧化鈦顏料屬於：", opts: ["有機顏料", "含鉛顏料", "無機顏料", "含汞顏料"] },
                { id: 79, ans: 4, q: "聚胺酯塗料如果加入硝化纖維素塗料溶劑會發生：", opts: ["橘子皮", "高光澤", "白化", "小氣泡與針孔"] },
                { id: 80, ans: 2, q: "室內空氣品質的好壞，一般是以空氣中的何者作為指標？", opts: ["一氧化碳", "二氧化碳", "氦氣", "氧氣"] }
            ]
        };

        const circleNums = ["①", "②", "③", "④"];
        let currentYear = "104";
        let currentMode = "exam"; // 'exam' | 'instant'

        // 各年度獨立狀態保存
        const yearStates = {
            "104": { userAnswers: {}, isSubmitted: false, filter: "all" },
            "105": { userAnswers: {}, isSubmitted: false, filter: "all" },
            "106": { userAnswers: {}, isSubmitted: false, filter: "all" }
        };

        function getActiveQuestions() {
            return allQuizData[currentYear];
        }

        function getActiveState() {
            return yearStates[currentYear];
        }

        // 自訂確認對話框
        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');

            const cleanup = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                confirmBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            confirmBtn.onclick = () => {
                cleanup();
                onConfirm();
            };
            cancelBtn.onclick = () => {
                cleanup();
            };
        }

        function init() {
            updateYearTabsUI();
            syncHeaderAndBannerUI();
            renderQuestionGrid();
            renderQuestions();
        }

        function switchYear(year) {
            if (currentYear === year) return;
            currentYear = year;
            document.getElementById('yearTitle').textContent = `${year}年度 車輛塗裝丙級 學科練習`;
            updateYearTabsUI();
            syncHeaderAndBannerUI();
            renderQuestionGrid();
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateYearTabsUI() {
            ["104", "105", "106"].forEach(yr => {
                const tabBtn = document.getElementById(`tab-${yr}`);
                const badge = document.getElementById(`tab-badge-${yr}`);
                const st = yearStates[yr];
                const answeredCount = Object.keys(st.userAnswers).length;

                if (st.isSubmitted) {
                    let correct = 0;
                    allQuizData[yr].forEach(q => {
                        if (st.userAnswers[q.id] === q.ans) correct++;
                    });
                    const score = (correct * 1.25).toFixed(2).replace(/\.00$/, '');
                    badge.textContent = `${score}分`;
                    badge.className = score >= 60 
                        ? "text-xs px-1.5 py-0.5 rounded-full bg-emerald-500 text-white font-bold"
                        : "text-xs px-1.5 py-0.5 rounded-full bg-rose-500 text-white font-bold";
                } else {
                    badge.textContent = `${answeredCount}/80`;
                    badge.className = yr === currentYear
                        ? "text-xs px-1.5 py-0.5 rounded-full bg-blue-100 text-blue-800 font-semibold"
                        : "text-xs px-1.5 py-0.5 rounded-full bg-slate-700 text-slate-300 font-normal";
                }

                if (yr === currentYear) {
                    tabBtn.className = "px-4 py-2 rounded-t-lg text-sm font-bold transition flex items-center gap-2 bg-white text-slate-900 shadow-xs";
                } else {
                    tabBtn.className = "px-4 py-2 rounded-t-lg text-sm font-bold transition flex items-center gap-2 bg-slate-800 text-slate-300 hover:bg-slate-700";
                }
            });
        }

        function setMode(mode) {
            currentMode = mode;
            const examBtn = document.getElementById('modeExamBtn');
            const instantBtn = document.getElementById('modeInstantBtn');
            if (mode === 'exam') {
                examBtn.className = "px-3 py-1.5 rounded-md font-medium bg-blue-600 text-white shadow-sm transition";
                instantBtn.className = "px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition";
            } else {
                instantBtn.className = "px-3 py-1.5 rounded-md font-medium bg-blue-600 text-white shadow-sm transition";
                examBtn.className = "px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition";
            }
            renderQuestions();
            renderQuestionGrid();
        }

        function selectOption(qId, optNum) {
            const st = getActiveState();
            if (st.isSubmitted) return;
            st.userAnswers[qId] = optNum;
            updateProgress();
            updateYearTabsUI();
            renderSingleQuestion(qId);
            renderQuestionGrid();
        }

        function updateProgress() {
            const st = getActiveState();
            const answeredCount = Object.keys(st.userAnswers).length;
            document.getElementById('progressBadge').textContent = `已作答: ${answeredCount} / 80`;
        }

        function syncHeaderAndBannerUI() {
            const st = getActiveState();
            const questionsData = getActiveQuestions();
            updateProgress();

            const banner = document.getElementById('resultBanner');
            if (st.isSubmitted) {
                let correct = 0;
                questionsData.forEach(item => {
                    if (st.userAnswers[item.id] === item.ans) correct++;
                });
                const rawScore = correct * 1.25;
                const score = rawScore.toFixed(2).replace(/\.00$/, '');
                const wrong = 80 - correct;

                document.getElementById('scoreText').textContent = score;
                document.getElementById('correctCount').textContent = correct;
                document.getElementById('wrongCount').textContent = wrong;

                const passBadge = document.getElementById('passStatusBadge');
                if (rawScore >= 60) {
                    passBadge.textContent = "及格";
                    passBadge.className = "ml-2 text-xs px-2 py-0.5 rounded font-bold bg-emerald-500 text-white";
                } else {
                    passBadge.textContent = "不及格";
                    passBadge.className = "ml-2 text-xs px-2 py-0.5 rounded font-bold bg-rose-500 text-white";
                }

                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }

            // 同步篩選按鈕外觀
            const allBtn = document.getElementById('filterAllBtn');
            const wrongBtn = document.getElementById('filterWrongBtn');
            if (st.filter === 'all') {
                allBtn.className = "px-3 py-1 rounded bg-slate-700 text-white font-medium";
                wrongBtn.className = "px-3 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700";
            } else {
                wrongBtn.className = "px-3 py-1 rounded bg-rose-600 text-white font-medium";
                allBtn.className = "px-3 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700";
            }
        }

        function renderQuestionGrid() {
            const grid = document.getElementById('questionGrid');
            grid.innerHTML = '';
            const questionsData = getActiveQuestions();
            const st = getActiveState();

            questionsData.forEach(item => {
                const uAns = st.userAnswers[item.id];
                const showAns = st.isSubmitted || (currentMode === 'instant' && uAns !== undefined);
                
                let bgClass = "bg-slate-100 text-slate-600 hover:bg-slate-200 border-slate-200";
                if (showAns) {
                    if (uAns === item.ans) {
                        bgClass = "bg-emerald-500 text-white border-emerald-600 font-bold";
                    } else {
                        bgClass = "bg-rose-500 text-white border-rose-600 font-bold";
                    }
                } else if (uAns !== undefined) {
                    bgClass = "bg-blue-600 text-white border-blue-700 font-bold";
                }

                const btn = document.createElement('button');
                btn.className = `text-xs py-1.5 rounded border transition ${bgClass}`;
                btn.textContent = item.id;
                btn.onclick = () => {
                    const el = document.getElementById(`q-card-${item.id}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                };
                grid.appendChild(btn);
            });
        }

        function renderQuestions() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            const questionsData = getActiveQuestions();
            const st = getActiveState();

            let visibleCount = 0;
            questionsData.forEach(item => {
                const uAns = st.userAnswers[item.id];
                if (st.isSubmitted && st.filter === 'wrong' && uAns === item.ans) {
                    return; // 只看錯題時略過答對的題目
                }
                visibleCount++;
                const card = document.createElement('div');
                card.id = `q-card-${item.id}`;
                card.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-5 transition";
                card.innerHTML = buildQuestionCardHTML(item);
                container.appendChild(card);
            });

            if (visibleCount === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 text-center">
                        <p class="text-lg font-bold text-emerald-600 mb-1">🎉 太棒了！本卷全部答對，沒有任何錯題！</p>
                        <p class="text-sm text-slate-500">可點擊上方「全部題目 (80)」檢視所有題目。</p>
                    </div>
                `;
            }
        }

        function renderSingleQuestion(qId) {
            const questionsData = getActiveQuestions();
            const item = questionsData.find(q => q.id === qId);
            const card = document.getElementById(`q-card-${qId}`);
            if (item && card) {
                card.innerHTML = buildQuestionCardHTML(item);
            }
        }

        function buildQuestionCardHTML(item) {
            const st = getActiveState();
            const uAns = st.userAnswers[item.id];
            const showResult = st.isSubmitted || (currentMode === 'instant' && uAns !== undefined);
            const isCorrect = uAns === item.ans;

            let statusBadge = '';
            if (showResult) {
                if (uAns === undefined) {
                    statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300">未作答 (正解: ${circleNums[item.ans - 1]})</span>`;
                } else if (isCorrect) {
                    statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">✓ 答對了</span>`;
                } else {
                    statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-300">✗ 答錯 (正解: ${circleNums[item.ans - 1]})</span>`;
                }
            } else if (uAns !== undefined) {
                statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200">已選 ${circleNums[uAns - 1]}</span>`;
            }

            const optionsHTML = item.opts.map((optText, idx) => {
                const optNum = idx + 1;
                const isSelected = uAns === optNum;
                const isRightAns = item.ans === optNum;

                let btnStyle = "border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700";
                let badgeIcon = "";

                if (showResult) {
                    if (isRightAns) {
                        btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold ring-1 ring-emerald-500";
                        badgeIcon = `<span class="ml-auto text-xs font-bold text-emerald-700 bg-emerald-200 px-2 py-0.5 rounded shrink-0">正確答案</span>`;
                    } else if (isSelected && !isRightAns) {
                        btnStyle = "border-rose-400 bg-rose-50 text-rose-900 line-through opacity-90";
                        badgeIcon = `<span class="ml-auto text-xs font-bold text-rose-700 bg-rose-200 px-2 py-0.5 rounded shrink-0">你的選擇</span>`;
                    } else {
                        btnStyle = "border-slate-200 bg-white text-slate-400 opacity-70";
                    }
                } else {
                    if (isSelected) {
                        btnStyle = "border-blue-600 bg-blue-50 text-blue-900 font-semibold ring-1 ring-blue-600";
                    }
                }

                return `
                    <button 
                        type="button"
                        onclick="selectOption(${item.id}, ${optNum})"
                        ${st.isSubmitted ? 'disabled' : ''}
                        class="option-btn w-full text-left px-4 py-3 rounded-lg border flex items-center gap-3 ${btnStyle}"
                    >
                        <span class="text-base font-bold shrink-0">${circleNums[idx]}</span>
                        <span class="text-sm sm:text-base">${optText}</span>
                        ${badgeIcon}
                    </button>
                `;
            }).join('');

            return `
                <div class="flex items-start justify-between gap-3 mb-3">
                    <div class="flex items-baseline gap-2">
                        <span class="inline-flex items-center justify-center bg-slate-800 text-white text-xs font-bold px-2.5 py-1 rounded-md shrink-0">
                            第 ${item.id} 題
                        </span>
                        <h2 class="text-base sm:text-lg font-semibold text-slate-900 leading-snug">${item.q}</h2>
                    </div>
                    <div class="shrink-0">${statusBadge}</div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-3">
                    ${optionsHTML}
                </div>
            `;
        }

        function executeSubmit() {
            const st = getActiveState();
            st.isSubmitted = true;
            updateYearTabsUI();
            syncHeaderAndBannerUI();
            renderQuestionGrid();
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function submitQuiz() {
            const st = getActiveState();
            if (st.isSubmitted) return;
            const answeredCount = Object.keys(st.userAnswers).length;
            if (answeredCount < 80) {
                showConfirmModal(
                    "尚未全部作答完畢",
                    `你在 ${currentYear} 年度還有 ${80 - answeredCount} 題尚未作答，確定要現在交卷對答案嗎？`,
                    executeSubmit
                );
            } else {
                executeSubmit();
            }
        }

        function setFilter(filterType) {
            const st = getActiveState();
            st.filter = filterType;
            syncHeaderAndBannerUI();
            renderQuestions();
        }

        function executeReset() {
            const st = getActiveState();
            st.userAnswers = {};
            st.isSubmitted = false;
            st.filter = 'all';
            updateYearTabsUI();
            syncHeaderAndBannerUI();
            renderQuestionGrid();
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetQuiz() {
            const st = getActiveState();
            if (Object.keys(st.userAnswers).length > 0 || st.isSubmitted) {
                showConfirmModal(
                    "重新測驗本年度",
                    `確定要清空 ${currentYear} 年度的所有作答紀錄並重新練習嗎？（其他年度的紀錄不會受影響）`,
                    executeReset
                );
            } else {
                executeReset();
            }
        }

        init();
    </script>
</body>
</html>
